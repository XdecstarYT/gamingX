<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PenShare — GamingX</title>
<link rel="stylesheet" href="penshare.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖊️</text></svg>">
</head>
<body>
<div id="screen-app" class="ps-screen">
  <header class="ps-topbar">
    <a class="ps-back" href="../../index.html">☰</a>
    <div class="ps-logo">🖊️ Pen<span>Share</span></div>
    <button class="ps-icon-btn" id="btn-profile">👤</button>
  </header>
  <main id="app-body" class="ps-main"></main>
  <nav class="ps-bottomnav">
    <button class="ps-nav-btn on" data-view="home"><span class="ic">🏠</span><span class="lb">Home</span></button>
    <button class="ps-nav-btn" data-view="search"><span class="ic">🔍</span><span class="lb">Search</span></button>
    <button class="ps-nav-btn ps-compose-fab" data-view="compose"><span class="ic">🖊️</span></button>
    <button class="ps-nav-btn" data-view="profile"><span class="ic">👤</span><span class="lb">Profile</span></button>
  </nav>
</div>

<div id="thread-overlay" class="ps-overlay hidden"></div>
<div id="ps-toast" class="ps-toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../assets/js/gx-social.js"></script>
<script src="penshare.js"></script>
</body>
</html>
