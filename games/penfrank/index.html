<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Penfrank — GamingX</title>
<link rel="stylesheet" href="penfrank.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
</head>
<body>

<!-- Main app (revealed after the shared GamingX auth gate) -->
<div id="screen-app" class="pf-screen pf-app-screen">
  <header class="pf-topbar">
    <a class="pf-back" href="../../index.html">☰</a>
    <div class="pf-toptabs" id="top-tabs">
      <button class="pf-toptab" data-feed="following">Following</button>
      <button class="pf-toptab on" data-feed="foryou">For You</button>
    </div>
    <button class="pf-icon-btn" id="btn-goto-profile">👤</button>
  </header>
  <main id="app-body" class="pf-main"></main>
  <nav class="pf-bottomnav">
    <button class="pf-nav-btn on" data-view="feed"><span class="ic">🏠</span><span class="lb">Home</span></button>
    <button class="pf-nav-btn pf-upload-fab" data-view="upload"><span class="ic">➕</span></button>
    <button class="pf-nav-btn" data-view="profile"><span class="ic">👤</span><span class="lb">Profile</span></button>
  </nav>
</div>

<div id="comment-overlay" class="pf-overlay hidden"></div>
<div id="comment-drawer" class="pf-drawer">
  <div class="pf-drawer-handle"></div>
  <div class="pf-drawer-title">Comments (<span id="cd-count">0</span>)</div>
  <div class="pf-drawer-list" id="cd-list"></div>
  <div class="pf-drawer-input-row">
    <input id="cd-input" type="text" maxlength="200" placeholder="Add a comment..." autocomplete="off">
    <button id="cd-send">Post</button>
  </div>
</div>

<div id="pf-toast" class="pf-toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../assets/js/gx-social.js"></script>
<script src="demo-content.js"></script>
<script src="penfrank.js"></script>
</body>
</html>
